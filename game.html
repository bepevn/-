<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
let W=1100,H=700,DPR=1;function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR)}window.addEventListener('resize',resize);resize();
const ui={hp:document.getElementById('hp'),energy:document.getElementById('energy'),stats:document.getElementById('stats'),overlay:document.getElementById('overlay'),boss:document.getElementById('boss')};
let state='menu',keys={},mouse={x:W*.65,y:H*.4,down:false},cam={x:0,y:0},shake=0,flash=0,hitstop=0,time=0,elapsed=0,kills=0,combo=0,comboTime=0,muted=false,audio,checkpoint=0,winTime=0;
let stage=0,gear=0;
const GEARS=[{name:'청뢰 팔찌',color:'#5fffe0',range:780,pull:1800,reel:130,reach:180,damage:34,cool:.25,dash:.75,desc:'긴 전자 사슬 · 표준 검격 · 로프 주변 감전'},{name:'홍련 반지',color:'#ff668c',range:680,pull:2100,reel:170,reach:145,damage:24,cool:.32,dash:.85,desc:'빠른 견인 · 전방 3연격 · 붉은 궤적'},{name:'공허 목걸이',color:'#c18aff',range:860,pull:1450,reel:80,reach:225,damage:52,cool:.65,dash:1.05,desc:'초장거리 중력 로프 · 360도 광역 베기'}];
const STAGES=[{name:'네온 슬럼',sky:'#0c142c',neon:'#5fffe0',boss:'SCRAPPER / 폐품 감시자'}, {name:'홍등 고가도로',sky:'#271024',neon:'#ff668c',boss:'MANTIS / 붉은 사냥꾼'}, {name:'보라빛 데이터 타워',sky:'#191035',neon:'#bd8aff',boss:'ORACLE / 데이터 신탁'}, {name:'기업 중추 · 블랙 코어',sky:'#091c29',neon:'#ffd578',boss:'BLACK CORE / 최종 감시자'}];
function equip(n){gear=n;hook=null;sound(650+n*150,.12,'triangle',.04,1.4);if(texts)texts.push({x:player.x,y:player.y-70,text:GEARS[n].name+' 장착',life:1.5,color:GEARS[n].color});canvas.focus()}
let player,enemies,particles,texts,rings,slashes,trails,bullets,hook=null,dashCD=0,slashCD=0,ultTime=0;
const WORLD={w:5600,h:1500};
const platforms=[{x:0,y:1190,w:680,h:310},{x:800,y:1080,w:380,h:420},{x:1350,y:950,w:340,h:550},{x:1840,y:1080,w:310,h:420},{x:2300,y:880,w:420,h:620},{x:2870,y:760,w:330,h:740},{x:3380,y:880,w:360,h:620},{x:3930,y:650,w:260,h:850},{x:4400,y:830,w:1200,h:670},{x:510,y:960,w:160,h:22},{x:1110,y:790,w:180,h:22},{x:2010,y:740,w:160,h:22},{x:3120,y:590,w:180,h:22},{x:3650,y:610,w:140,h:22}];
const anchors=[{x:470,y:720},{x:940,y:610},{x:1420,y:540},{x:1900,y:480},{x:2390,y:420},{x:2850,y:350},{x:3350,y:300},{x:3820,y:280},{x:4270,y:330},{x:4700,y:350},{x:5180,y:330}];
const beacons=[{x:180,y:1190},{x:2440,y:880},{x:4530,y:830}];
const basePlatforms=platforms.map(p=>({...p})),baseAnchors=anchors.map(a=>({...a}));
function buildStage(){platforms.splice(0,platforms.length,...basePlatforms.map((p,i)=>{let dy=i===0||i===8?0:Math.min(stage,3)*Math.sin(i*1.9+stage*.6)*48;return {...p,y:p.y+dy,h:p.h>50?p.h-dy:p.h}}));anchors.splice(0,anchors.length,...baseAnchors.map((a,i)=>({...a,y:a.y+Math.min(stage,3)*Math.cos(i*1.3+stage*.5)*28})));beacons[1].y=platforms[4].y;document.getElementById("sector").textContent=String(stage+1).padStart(2,"0")+" / "+STAGES[stage].name;ui.boss.firstChild.textContent=STAGES[stage].boss;}
function reset(){buildStage();player={x:180,y:1140,vx:0,vy:0,hp:100,energy:40,jumps:0,ground:false,face:1,inv:0,dash:0,dead:false};enemies=[{x:940,y:1010},{x:1480,y:880},{x:1950,y:1010},{x:2410,y:800},{x:2590,y:730},{x:3000,y:690},{x:3480,y:800},{x:4040,y:580},{x:4620,y:750}].map((e,i)=>({...e,homeY:e.y,hp:60,maxHp:60,t:i*1.7,cd:1+i*.17,boss:false}));enemies.push({x:5100,y:620,homeY:620,hp:720,maxHp:720,t:0,cd:2,boss:true});enemies.forEach((e,i)=>{if(!e.boss){const ground=platforms.filter(p=>p.h>50&&e.x>=p.x&&e.x<=p.x+p.w)[0];e.homeY=e.y=(ground?ground.y:e.y+80)-80;e.hp=e.maxHp=60+stage*15;}else{e.hp=e.maxHp=720+stage*220;e.homeY=620-stage*25;}});particles=[];texts=[];rings=[];slashes=[];trails=[];bullets=[];hook=null;dashCD=slashCD=ultTime=0;checkpoint=0;winTime=0;kills=combo=elapsed=0;comboTime=0;cam={x:0,y:700};shake=flash=hitstop=0;}
function sound(freq=300,duration=.1,type='sine',vol=.06,slide=1){if(muted||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),audio.currentTime+duration);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function start(){stage=0;reset();state='play';ui.overlay.style.display='none';try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}canvas.focus();sound(180,.3,'sawtooth',.04,3)}

function pause(){if(state==='play'){state='pause';showOverlay('잠시 숨 고르기','사슬을 다시 잡을 준비가 되면 계속하세요.','계속하기',()=>{state='play';ui.overlay.style.display='none';canvas.focus()})}else if(state==='pause'){state='play';ui.overlay.style.display='none';canvas.focus()}}
document.getElementById('pauseBtn').onclick=pause;
function showOverlay(title,desc,label,fn){ui.overlay.style.display='flex';ui.overlay.innerHTML='<div class="card"><div class="tag">CHAIN / AFTERGLOW</div><h1>'+title+'</h1><p>'+desc+'</p><button id="action">'+label+'</button></div>';document.getElementById('action').onclick=fn;}
window.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;if(e.code==='KeyP'||e.code==='Escape')pause();if(e.code==='KeyM')muted=!muted;if(state!=='play')return;if(e.code==='KeyW'||e.code==='Space'||e.code==='ArrowUp')jump();if(e.code==='KeyQ'||e.code==='ShiftLeft'||e.code==='KeyK')dash();if(e.code==='KeyJ')slash();if(e.code==='KeyE')ultimate();});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};mouse.down=false;hook=null;if(state==='play')pause()});
canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;if(state!=='play')return;if(e.button===0){mouse.down=true;attach()}if(e.button===2)slash()});window.addEventListener('pointerup',e=>{if(e.button===0){mouse.down=false;if(hook)sound(480,.08,'triangle',.03,.5);hook=null}});
function jump(){if(player.jumps>=2)return;player.vy=-610;player.jumps++;player.ground=false;burst(player.x,player.y+20,18,'#64ffe3',150);rings.push({x:player.x,y:player.y+20,r:8,life:.35,max:.35,color:'#7affdf'});sound(player.jumps===1?330:510,.12,'triangle',.06,1.4)}
function aim(){let x=mouse.x+cam.x-player.x,y=mouse.y+cam.y-player.y,d=Math.hypot(x,y)||1;return{x:x/d,y:y/d}}
function attach(){let target=null,best=Infinity;for(const a of anchors){let d=Math.hypot(a.x-player.x,a.y-player.y),m=Math.hypot(a.x-cam.x-mouse.x,a.y-cam.y-mouse.y);if(d<GEARS[gear].range&&m<best){best=m;target=a}}if(target&&best<230){hook={a:target,len:Math.min(350,Math.hypot(target.x-player.x,target.y-player.y))};player.jumps=Math.min(player.jumps,1);burst(target.x,target.y,20,'#65ffe0',160);sound(780,.17,'sawtooth',.03,.35)}else{texts.push({x:player.x,y:player.y-50,text:'밝은 고리를 조준하세요',life:1,color:'#a4bfd2'})}}
function dash(){if(dashCD>0)return;let a=aim();player.vx=a.x*1100;player.vy=a.y*1100;player.dash=.19;player.inv=Math.max(player.inv,.25);dashCD=GEARS[gear].dash;shake=7;burst(player.x,player.y,24,'#59eaff',300);sound(150,.2,'sawtooth',.05,4);for(let e of enemies)if(e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<120)damageEnemy(e,35)}
function slash(){if(slashCD>0)return;const g=GEARS[gear];slashCD=g.cool;let a=aim(),ang=Math.atan2(a.y,a.x);player.face=a.x>=0?1:-1;for(let i=0;i<(gear===1?3:1);i++)slashes.push({x:player.x,y:player.y,ang:ang+(i-1)*.3,life:.22+i*.04,max:.30,r:g.reach-20-i*13,color:g.color,full:gear===2});sound(560,.11,'sawtooth',.04,.2);let hit=false;for(const e of enemies){let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);if(e.hp>0&&d<g.reach&&(gear===2||(dx*a.x+dy*a.y)/(d||1)>-.1)){damageEnemy(e,g.damage*(gear===1?3:1));hit=true}}if(hit){hitstop=.045;shake=9}if(gear===2)rings.push({x:player.x,y:player.y,r:20,life:.25,max:.25,color:g.color});}
function ultimate(){if(player.energy<100){texts.push({x:player.x,y:player.y-60,text:'에너지 100 필요',life:1,color:'#fc8cff'});return}player.energy=0;ultTime=.85;player.inv=1.2;shake=26;flash=.7;hitstop=.09;sound(65,.8,'sawtooth',.09,4);rings.push({x:player.x,y:player.y,r:20,life:.85,max:.85,color:'#ee79ff'});burst(player.x,player.y,140,'#eb7eff',700);for(let e of enemies)if(e.hp>0&&Math.hypot(e.x-player.x,e.y-player.y)<720)damageEnemy(e,e.boss?230:200);bullets=bullets.filter(b=>Math.hypot(b.x-player.x,b.y-player.y)>750);texts.push({x:player.x,y:player.y-120,text:'잔 광 해 방',life:1.5,color:'#fff'})}
function burst(x,y,n,color,speed){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=Math.random()*speed;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.55,max:.8,color,size:1+Math.random()*3})}if(particles.length>1500)particles.splice(0,particles.length-1500)}
function damageEnemy(e,n){if(e.hp<=0)return;e.hp-=n;e.hurt=.16;burst(e.x,e.y,e.boss?30:18,'#ff739e',280);texts.push({x:e.x,y:e.y-26,text:String(n),life:.65,color:'#fff'});player.energy=Math.min(100,player.energy+8);if(e.hp<=0){kills++;combo++;comboTime=4;player.energy=Math.min(100,player.energy+14);burst(e.x,e.y,55,'#ffb159',420);shake=14;sound(90,.23,'square',.045,.3);if(e.boss){winTime=1.6;bullets=[]}}}
function hurt(n){if(player.inv>0||state!=='play')return;player.hp-=n;player.inv=1;shake=15;flash=.2;combo=0;burst(player.x,player.y,25,'#ff497f',220);sound(100,.18,'sawtooth',.06,.3);if(player.hp<=0){state='dead';showOverlay('신호 소실','마지막 체크포인트에서 다시 도전할 수 있습니다. 적의 체력은 유지되며, 생명력은 회복됩니다.','체크포인트 재시작',respawn)}}
function respawn(){const c=beacons[checkpoint];Object.assign(player,{x:c.x,y:c.y-40,vx:0,vy:0,hp:100,inv:2,jumps:0,dash:0});hook=null;bullets=[];state='play';cam.x=player.x-W*.35;cam.y=player.y-H*.55;ui.overlay.style.display='none';canvas.focus()}
function update(dt){time+=dt;if(state!=='play')return;elapsed+=dt;dashCD=Math.max(0,dashCD-dt);slashCD=Math.max(0,slashCD-dt);player.inv=Math.max(0,player.inv-dt);player.dash=Math.max(0,player.dash-dt);ultTime=Math.max(0,ultTime-dt);comboTime-=dt;if(comboTime<=0)combo=0;player.energy=Math.min(100,player.energy+dt*1.6);
let move=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);if(player.dash<=0){player.vx+=move*2000*dt;player.vx*=Math.exp(-(player.ground?9:1.5)*dt);player.vx=Math.max(-630,Math.min(630,player.vx));player.vy+=1450*dt;if(move)player.face=move}
if(hook){const dx=hook.a.x-player.x,dy=hook.a.y-player.y,d=Math.hypot(dx,dy)||1;player.vx+=dx/d*GEARS[gear].pull*dt;player.vy+=dy/d*GEARS[gear].pull*dt;hook.len=Math.max(90,hook.len-90*dt)}

helpMenu=function(){showOverlay('전투 인터페이스','W 점프 · Q 대시 · E 궁극기 · R 산데비스탄<br>우클릭 / J 평타: 전방 탄환 반사 (0.16초 판정)<br>좌클릭 유지: 로프 · C: 조준한 적 속박 · T: 전격 코일<br>F 환경 상호작용 · P 일시정지 · 우측 하단 퇴장<br>연습장 B 정비실 / N 초기화<br><br>로프 최대 연결 거리 620px · 빈 슬롯 허용 · 중복 장착 불가<br>물체는 구역 진입 때 무작위 배치, 사망 재부팅 시 유지','메인 메뉴',menu);};


document.getElementById('pauseBtn').onclick=()=>pause();
const v5DrawBody=drawPlayer;drawPlayer=function(x,y,alpha=1,ghost=false){v5DrawBody(x,y,alpha,ghost);if(!ghost&&state!=='dying'){slots.forEach((id,i)=>{if(id){const sock=moduleSocket(id);moduleArt(ctx,id,x+sock.x*.23+(i?4:-4),y+sock.y*.23,.17,alpha);}});}};

reset();menu();let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.033);last=now;shake*=Math.exp(-12*dt);flash=Math.max(0,flash-dt*1.8);if(hitstop>0)hitstop-=dt;else update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
